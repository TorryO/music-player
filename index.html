<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f8a68b" />
  <title>Music Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="player">
    <header class="brand">
      <h1>Music Player</h1>
    </header>

    <section class="now-playing">
      <div class="art" id="art">♪</div>
      <div class="meta">
        <div id="trackTitle">No track selected</div>
        <div id="trackArtist">—</div>
      </div>
    </section>

    <input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="Seek" />
    <div class="times">
      <span id="currentTime">0:00</span>
      <span id="duration">0:00</span>
    </div>

    <div class="controls">
      <button id="prev" title="Previous">⏮</button>
      <button id="playPause" title="Play">▶</button>
      <button id="next" title="Next">⏭</button>
    </div>

    <div class="extras">
      <button id="shuffle" title="Shuffle: off">🔀</button>
      <div class="volume">
        <span>🔊</span>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" aria-label="Volume" />
      </div>
      <button id="repeat" title="Repeat: off">🔁</button>
    </div>

    <ul id="playlist"></ul>

    <label class="add-files">
      + Add music files
      <input type="file" id="fileInput" accept="audio/*" multiple hidden />
    </label>
  </main>

  <audio id="audio"></audio>
  <script src="script.js"></script>
</body>
</html>
