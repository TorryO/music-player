<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Player</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="player">
    <h1>Music Player</h1>

    <div class="now-playing">
      <div class="art" id="art">♪</div>
      <div class="meta">
        <div id="trackTitle">No track selected</div>
        <div id="trackArtist">—</div>
      </div>
    </div>

    <input type="range" id="seek" min="0" max="100" value="0" step="0.1" />
    <div class="times">
      <span id="currentTime">0:00</span>
      <span id="duration">0:00</span>
    </div>

    <div class="controls">
      <button id="prev" title="Previous">⏮</button>
      <button id="playPause" title="Play">▶</button>
      <button id="next" title="Next">⏭</button>
    </div>

    <div class="volume">
      <span>🔊</span>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" />
    </div>

    <ul id="playlist"></ul>

    <label class="add-files">
      + Add music files
      <input type="file" id="fileInput" accept="audio/*" multiple hidden />
    </label>
  </div>

  <audio id="audio"></audio>
  <script src="script.js"></script>
</body>
</html>
